name: Feature request
description: Suggest an idea or improvement.
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        xyChat stays offline and private: features that send chat data to a server, or connect to WhatsApp accounts, are out of scope.
