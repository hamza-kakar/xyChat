name: Bug report
description: Something doesn't work as expected.
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. **Please don't paste real chat content, names or phone numbers.** If an export is needed to reproduce the problem, make one up or anonymize it first with `pnpm anonymize`.
        For security problems, use the Security tab instead (see SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Import an iOS export with media
        2. Open the chat
        3. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown in Settings → Diagnostics.
      placeholder: '1.0.0'
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Device and browser
      options:
        - iPhone or iPad (installed to the Home Screen)
        - iPhone or iPad (Safari tab)
        - Android
        - Desktop
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and browser version
      placeholder: 'iOS 18.2, Safari'
  - type: dropdown
    id: export
    attributes:
      label: Export type (if the problem is about importing)
      options:
        - Not about importing
        - iOS export, with media (.zip)
        - iOS export, without media
        - Android export, with media (.zip)
        - Android export, without media (.txt)
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Optional. Copy the details from Settings → Diagnostics. They contain no chat content.
      render: text
