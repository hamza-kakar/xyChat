pre-commit:
  parallel: true
  commands:
    prettier:
      glob: '*.{js,cjs,mjs,ts,tsx,json,css,html,md,yml,yaml}'
      run: pnpm exec prettier --write --ignore-unknown {staged_files}
      stage_fixed: true
    eslint:
      glob: '*.{js,cjs,mjs,ts,tsx}'
      run: pnpm exec eslint --no-warn-ignored {staged_files}
    typecheck:
      run: pnpm typecheck

commit-msg:
  commands:
    conventional:
      run: >
        grep -qE '^(feat|fix|test|docs|chore|refactor|perf|ci|build)(\([a-z0-9./-]+\))?!?: ' {1}

pre-push:
  commands:
    verify:
      run: pnpm typecheck && pnpm test
